<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">授权策略引擎架构</title>
  <desc id="desc">应用可通过 MoonBit 库或原生命令行提供策略、请求和实体数据，授权引擎解析策略并结合实体关系进行求值，返回授权决定、命中策略和求值错误。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#496977"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} .title{font-size:42px;font-weight:700;fill:#18343d}.brand{font-size:23px;font-weight:600;fill:#43706c;letter-spacing:1px}.head{font-size:27px;font-weight:700;fill:#294a55}.name{font-size:29px;font-weight:700;fill:#183e4b}.detail{font-size:23px;fill:#496977}.white{fill:#fff}.subwhite{font-size:23px;fill:#d4f1e9}.line{fill:none;stroke:#78939b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="800" fill="#f5f8f7"/>
  <rect width="18" height="800" fill="#087e70"/>
  <text x="75" y="86" class="brand">CEDAR AUTH ENGINE</text>
  <text x="75" y="150" class="title">授权策略引擎架构</text>
  <path d="M75 181 H1525" stroke="#cddedb" stroke-width="2"/>

  <text x="75" y="237" class="head">接入方式</text>
  <text x="385" y="237" class="head">输入数据</text>
  <text x="800" y="237" class="head">授权处理</text>
  <text x="1250" y="237" class="head">授权结果</text>

  <rect x="75" y="282" width="250" height="142" rx="12" fill="#e1eff9" stroke="#a7c8dd" stroke-width="2"/>
  <rect x="75" y="282" width="8" height="142" rx="4" fill="#2472a5"/>
  <text x="103" y="337" class="name">应用集成</text>
  <text x="103" y="380" class="detail">MoonBit 库</text>
  <rect x="75" y="451" width="250" height="142" rx="12" fill="#e1eff9" stroke="#a7c8dd" stroke-width="2"/>
  <rect x="75" y="451" width="8" height="142" rx="4" fill="#2472a5"/>
  <text x="103" y="506" class="name">命令行</text>
  <text x="103" y="549" class="detail">原生 CLI</text>

  <rect x="385" y="273" width="338" height="105" rx="12" fill="#e4f3ed" stroke="#b4d9cb" stroke-width="2"/>
  <text x="410" y="316" class="name">授权策略</text>
  <text x="410" y="350" class="detail">允许、禁止与条件</text>
  <rect x="385" y="397" width="338" height="105" rx="12" fill="#e4f3ed" stroke="#b4d9cb" stroke-width="2"/>
  <text x="410" y="440" class="name">授权请求</text>
  <text x="410" y="474" class="detail">主体、操作、资源、上下文</text>
  <rect x="385" y="521" width="338" height="105" rx="12" fill="#e4f3ed" stroke="#b4d9cb" stroke-width="2"/>
  <text x="410" y="564" class="name">实体数据</text>
  <text x="410" y="598" class="detail">属性、标签与父级关系</text>

  <path d="M325 353 H350 V449 H370" class="line"/><path d="M325 522 H350 V449 H370" class="line"/>
  <path d="M723 449 H782" class="line"/>
  <rect x="800" y="273" width="376" height="353" rx="14" fill="#08776a"/>
  <text x="829" y="324" class="name white">策略解析</text>
  <text x="829" y="359" class="subwhite">读取策略与输入数据</text>
  <path d="M829 382 H1147" stroke="#72b5a8" stroke-width="2"/>
  <text x="829" y="427" class="name white">实体查询</text>
  <text x="829" y="462" class="subwhite">实体层级与属性</text>
  <path d="M829 485 H1147" stroke="#72b5a8" stroke-width="2"/>
  <text x="829" y="530" class="name white">策略求值</text>
  <text x="829" y="565" class="subwhite">禁止优先，默认拒绝</text>
  <path d="M1176 449 H1232" class="line"/>
  <rect x="1250" y="273" width="275" height="353" rx="14" fill="#fff" stroke="#cbded9" stroke-width="2"/>
  <rect x="1250" y="273" width="275" height="85" rx="14" fill="#d16d32"/>
  <rect x="1250" y="342" width="275" height="16" fill="#d16d32"/>
  <text x="1277" y="328" class="name white">允许 / 拒绝</text>
  <text x="1277" y="424" class="name">命中策略</text>
  <path d="M1277 458 H1498" stroke="#d8e7e2" stroke-width="2"/>
  <text x="1277" y="526" class="name">求值错误</text>
  <text x="1277" y="567" class="detail">错误策略跳过</text>
</svg>
