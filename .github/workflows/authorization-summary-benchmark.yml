name: Measure batch authorization summary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s '0.10.18+6c83a7f62'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build native CLI
        run: moon build cmd/cedar-auth-engine --target native
      - name: Measure full and summary output
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/authorization_summary.py --engine _build/native/debug/build/cmd/cedar-auth-engine/cedar-auth-engine.exe --requests 32768 --repeat 3 --revision "$GITHUB_SHA" --toolchain 'moonc 0.10.18+6c83a7f62' --output authorization-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: authorization-summary-benchmark
          path: authorization-summary.json
          if-no-files-found: error
